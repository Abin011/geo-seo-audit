<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GEO + SEO 审计工具</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <div class="bg-grid"></div>
  <header class="site-header">
    <div class="logo">
      <span class="logo-icon">◈</span>
      <div>
        <h1>GEO + SEO 审计</h1>
        <p>外贸 B2B 独立站 · 中文诊断报告</p>
      </div>
    </div>
  </header>

  <main class="container">
    <section class="card card-form" id="form-section">
      <h2>输入网站 URL</h2>
      <p class="hint">自动分析基础 SEO、技术 SEO、GEO（AI 搜索可见性），并生成可下载的中文报告。</p>
      <form id="audit-form">
        <div class="url-row">
          <input
            type="url"
            id="url"
            name="url"
            placeholder="https://example.com"
            required
            autocomplete="url"
          >
          <button type="submit" id="btn-submit" class="btn-primary">
            开始审计
          </button>
        </div>
        <div class="options">
          <label>
            Sitemap 解析上限
            <input type="number" id="max_pages" value="50" min="10" max="100">
          </label>
          <label>
            额外抽样页面数
            <input type="number" id="samples" value="6" min="2" max="15">
          </label>
        </div>
      </form>
    </section>

    <section class="card card-progress hidden" id="progress-section">
      <h2>审计进行中</h2>
      <p class="progress-url" id="progress-url"></p>
      <div class="progress-bar-wrap">
        <div class="progress-bar" id="progress-bar" style="width: 0%"></div>
      </div>
      <p class="progress-msg" id="progress-msg">准备中…</p>
      <ul class="log-list" id="log-list"></ul>
    </section>

    <section class="card card-result hidden" id="result-section">
      <h2>审计完成</h2>
      <div class="score-row">
        <div class="score-card seo">
          <span class="score-label">SEO 评分</span>
          <span class="score-value" id="score-seo">—</span>
          <span class="score-rating" id="rating-seo"></span>
        </div>
        <div class="score-card geo">
          <span class="score-label">GEO 评分</span>
          <span class="score-value" id="score-geo">—</span>
          <span class="score-rating" id="rating-geo"></span>
        </div>
      </div>
      <div class="meta-row">
        <span id="meta-issues">—</span>
        <span id="meta-pages">—</span>
      </div>
      <div class="sub-scores" id="sub-scores"></div>
      <div class="actions">
        <a class="btn-primary" id="btn-view" href="#" target="_blank">查看完整报告</a>
        <a class="btn-secondary" id="btn-md" href="#">下载 Markdown</a>
        <a class="btn-secondary" id="btn-html" href="#">下载 HTML</a>
        <a class="btn-secondary" id="btn-json" href="#">下载 JSON</a>
        <button type="button" class="btn-ghost" id="btn-new">审计新网站</button>
      </div>
    </section>

    <section class="card card-error hidden" id="error-section">
      <h2>审计失败</h2>
      <p class="error-text" id="error-text"></p>
      <button type="button" class="btn-primary" id="btn-retry">重试</button>
    </section>
  </main>

  <footer class="site-footer">
    <p>评分基于页面抓取与规则引擎 · 非 Google 官方数据 · 优化前请人工核对事实性内容</p>
  </footer>

  <script src="/static/app.js"></script>
</body>
</html>
