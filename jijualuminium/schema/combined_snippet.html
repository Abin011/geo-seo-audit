<!-- ===== FAQPage — 13 B2B FAQs (MOQ, lead time, payment, alloys, Incoterms, certs, warranty…) — source: f_faqpage.json ===== -->
<script type="application/ld+json">
{

  "@type": "FAQPage",
  "@id": "https://jijualuminium.com/#faq",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "What is the minimum order quantity (MOQ) for custom aluminum extrusions at JIJU?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Our standard MOQ for custom aluminum extrusion is 500 kg per profile design. For stock 6063 profiles such as door, window, curtain-wall and industrial framing series, we accept trial orders from 100 kg. Larger orders above 5,000 kg unlock tiered pricing and free die amortization. Contact info@jijualuminium.com with your drawing and target volume for an exact quotation."
      }
    },
    {
      "@type": "Question",
      "name": "What is the typical lead time for custom aluminum profile orders?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "For a new custom profile: mold/die manufacturing takes 7–12 days, sample extrusion 2–3 days, and mass production 15–20 days after sample approval. Total lead time is typically 25–35 days. Reorders using an existing JIJU die ship in 12–18 days. Add 15–40 days for ocean freight from Qingdao depending on destination."
      }
    },
    {
      "@type": "Question",
      "name": "Can I request a sample before placing a bulk order?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Free 200–500 mm samples of stock JIJU profiles are available; the customer pays courier costs (typically USD 30–80 by DHL/FedEx). For custom dies, we extrude 3–6 m of sample profile after die trial; the sample fee is credited back against the first production order above 1,000 kg."
      }
    },
    {
      "@type": "Question",
      "name": "What payment terms do you accept?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "We accept 30% T/T deposit with 70% balance against B/L copy as our default term. We also accept 100% irrevocable L/C at sight for orders above USD 30,000, Alibaba Trade Assurance, Western Union and PayPal for samples. Long-term repeat customers can apply for OA 30–60 day terms after credit review."
      }
    },
    {
      "@type": "Question",
      "name": "Which aluminum alloys and tempers can JIJU extrude?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "We routinely extrude 6063, 6061, 6005, 6082, 6N01 and 6066 alloys in tempers T4, T5, T6 and T66. 6063-T5 is the workhorse for architectural windows and doors; 6061-T6 and 6082-T6 are used for structural, transport and machined parts. We can also run special alloys on request with a minimum billet quantity."
      }
    },
    {
      "@type": "Question",
      "name": "What surface treatments do you offer in-house?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "JIJU operates in-house anodizing (clear, black, bronze, champagne, matte, sandblast, brushed), powder coating (RAL/Pantone), PVDF fluorocarbon coating, electrophoretic coating and wood-grain heat-transfer printing. Film thicknesses meet Qualicoat / AAMA 2603–2605 standards on request."
      }
    },
    {
      "@type": "Question",
      "name": "How much does a custom aluminum extrusion die (mold) cost?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "A typical solid-profile die costs USD 200–500 and a hollow/thermal-break die USD 500–1,500, depending on circumscribing circle diameter, wall thickness and complexity. Dies remain JIJU property and are stored free of charge; the mold fee is refundable or amortized when cumulative orders exceed 5–10 tonnes."
      }
    },
    {
      "@type": "Question",
      "name": "Do you support custom design and DFM (design for manufacturability) review?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. Our 45-engineer R&D team reviews every DWG/DXF/STEP file for extrudability — wall thickness ratios, tongue-to-gap ratios, symmetry, corner radii and tolerance — and returns annotated feedback within 24 hours. We co-engineer profiles with our customers to lower mold cost and improve extrusion yield."
      }
    },
    {
      "@type": "Question",
      "name": "Do you accept OEM and ODM projects?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. We are an OEM/ODM-first manufacturer. We can print your brand on labels, packaging, end-caps and even profiles, sign NDAs, and ship under your private label. ODM service covers full profile development from sketch to mass production, including hardware sourcing and assembly."
      }
    },
    {
      "@type": "Question",
      "name": "How are aluminum profiles packed for export?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Standard packing is PE protective film on each profile, kraft paper interlayer, then bundling with PP straps into wooden pallets or fumigation-free plywood crates suitable for sea freight. Maximum bundle weight 1,000 kg. Inner cartons, anti-corrosion paper and customer-specified labels are available."
      }
    },
    {
      "@type": "Question",
      "name": "Which Incoterms and ports do you ship from?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Default Incoterm is FOB Qingdao port (Shandong, China). We also support EXW Linqu factory, CIF and CFR to any major destination port, DAP/DDP door-to-door via our forwarder network, FCL 20′/40′HQ containers and LCL consolidations. CIP and DPU available on request under Incoterms 2020."
      }
    },
    {
      "@type": "Question",
      "name": "What certifications and quality standards does JIJU comply with?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "JIJU is certified to ISO 9001 (quality), ISO 14001 (environment) and ISO 45001 (occupational health & safety). Profiles can be produced to GB/T 5237, EN 12020, AAMA 611/2603–2605, Qualanod and Qualicoat. Mill test certificates (MTC), salt-spray test reports and SGS/BV third-party inspections are available."
      }
    },
    {
      "@type": "Question",
      "name": "Do you offer a warranty on your aluminum profiles?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes. JIJU warrants raw 6063 mill-finish profiles against material defects for 12 months from B/L date. Anodized profiles carry a 10-year color-fastness warranty, powder-coated profiles up to 15 years and PVDF coatings up to 25 years (AAMA 2605), subject to specified film thickness and proper installation."
      }
    },
    {
      "@type": "Question",
      "name": "What after-sales and technical support can I expect?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Each project gets a dedicated sales engineer and a backup. We respond to RFQs within 24 hours, share weekly production photos during manufacturing, provide free DXF/STEP profile data, and run a WhatsApp/WeChat group for live updates. Claims are processed within 7 working days of documented evidence."
      }
    }
